name: Check perfume prices

on:
  schedule:
    - cron: '0 9,19 * * *'
      timezone: Asia/Almaty
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read prices without sending notifications
        type: boolean
        default: true
      test_notification:
        description: Send a Telegram/email delivery test from GitHub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: perfume-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHECK_STORE: ${{ vars.CHECK_STORE || 'all' }}
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFICATION_CHANNEL: ${{ vars.NOTIFICATION_CHANNEL || 'telegram' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Verify notification delivery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        run: |
          python - <<'PY'
          import asyncio
          from app.config import Settings
          from app.notify import send_notification
          asyncio.run(send_notification(Settings(),
              "Тест доставки из GitHub Actions: уведомления Ombré Leather работают.\n"
              "Проверки: 09:00 и 19:00 (Алматы). Порог: строго ниже 71 000 ₸, 50 мл.\n"
              "Это тест связи, а не сообщение о снижении цены."))
          PY
      - name: Check prices
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ "$NOTIFICATIONS_ENABLED" != "true" ]; then
            xvfb-run -a python -m app.check --dry-run
          else
            xvfb-run -a python -m app.check
          fi

  keep-schedule-active:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record activity once a month
        # Public scheduled workflows otherwise stop after 60 days of inactivity.
        run: |
          month=$(date -u +%Y-%m)
          previous=$(cat .github/monitor-heartbeat 2>/dev/null || true)
          if [ "$month" = "$previous" ]; then
            exit 0
          fi
          printf '%s\n' "$month" > .github/monitor-heartbeat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/monitor-heartbeat
          git commit -m "Keep price-check schedule active ($month)"
          git push
