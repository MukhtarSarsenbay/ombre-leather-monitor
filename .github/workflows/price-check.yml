name: Check perfume prices

on:
  schedule:
    - cron: '0 9,19 * * *'
      timezone: Asia/Almaty
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read prices without sending notifications
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: perfume-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NOTIFICATION_CHANNEL: ${{ vars.NOTIFICATION_CHANNEL || 'telegram' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Check prices
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ] || [ "$NOTIFICATIONS_ENABLED" != "true" ]; then
            xvfb-run -a python -m app.check --dry-run
          else
            xvfb-run -a python -m app.check
          fi
