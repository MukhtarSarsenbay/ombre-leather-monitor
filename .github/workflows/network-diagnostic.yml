name: Test alternate storefront network

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y xvfb xauth
      - name: Start official free WARP local proxy
        run: bash scripts/start_warp_proxy.sh
      - name: Read the public Mon Amie offer through the proxy
        run: xvfb-run -a python scripts/diagnose_proxy_browser.py
      - name: Remove ephemeral WARP registration
        if: always()
        run: |
          if command -v warp-cli >/dev/null; then
            warp-cli --accept-tos disconnect || true
            warp-cli --accept-tos registration delete || true
          fi
