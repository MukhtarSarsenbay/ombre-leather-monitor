name: Handle Telegram commands

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perfume-price-check
  cancel-in-progress: false

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHECK_STORE: goldapple
      NOTIFICATION_CHANNEL: telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight command reader
        run: pip install httpx==0.28.1 pydantic-settings==2.15.0
      - name: Read authorized Telegram commands
        id: commands
        run: python -m app.telegram_commands probe --state "$RUNNER_TEMP/telegram-command.json"
      - name: Install price checker only when requested
        if: steps.commands.outputs.requested == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Reply with the current Gold Apple price
        if: steps.commands.outputs.requested == 'true'
        run: python -m app.telegram_commands run --state "$RUNNER_TEMP/telegram-command.json"
